# Composite run steps do not inherit job defaults.run. Match .github/actions/setup:
# every run step declares shell and working-directory explicitly.
name: Setup Transit Python workspace
description: Install Python, uv, and the Transit database workspace dependencies.

inputs:
  working-directory:
    description: Directory containing the Python workspace.
    required: false
    default: "apps/db"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "0.11.15"

    - name: Install project dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv sync --locked
