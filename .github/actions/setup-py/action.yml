# Composite run steps do not inherit job defaults.run. Match .github/actions/setup:
name: Setup Transit Python workspace
description: Install Python, uv, and the Transit database workspace dependencies.

inputs:
  working-directory:
    description: Directory containing the Python workspace.
    required: false
    default: "apps/db"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: .python-version

    - name: Set up uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.11.15"

    - name: Install project dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv sync --locked

    - name: Verify Python toolchain
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        uv run python --version
        uv run python -c 'import sys; raise SystemExit(sys.version_info[:2] != (3, 12))'
        test "$(uv --version | cut -d' ' -f1,2)" = "uv 0.11.15"
