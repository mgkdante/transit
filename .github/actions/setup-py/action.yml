# Composite run steps do not inherit job defaults.run. Match .github/actions/setup:
name: Setup Transit Python workspace
description: Install Python, uv, and the Transit database workspace dependencies.

inputs:
  working-directory:
    description: Directory containing the Python workspace.
    required: false
    default: "apps/db"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: .python-version

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.4"

    - name: Install project dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv sync --locked

    - name: Verify Python toolchain
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        uv run python --version
        uv run python -c 'import sys; raise SystemExit(sys.version_info[:2] != (3, 12))'
        test "$(uv --version | cut -d' ' -f1,2)" = "uv 0.13.4"
