name: Admin deploy now

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or branch to deploy
        required: true
        type: string
      target:
        description: Production Worker to deploy
        type: choice
        options: [web, data-proxy, both]
        default: web

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    concurrency:
      group: transit-data-edge-production
      cancel-in-progress: false
    env:
      TRANSIT_BUILD_TARGET: production
      PUBLIC_SITE_ORIGIN: https://transit.yesid.dev
      PUBLIC_V1_BASE: https://data.yesid.dev/v1
      PUBLIC_INDEXING: "true"
    steps:
      - name: Validate deployment request
        shell: pwsh
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          DEPLOY_TARGET: ${{ inputs.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $requestedRef = $env:REQUESTED_REF
          if ([string]::IsNullOrWhiteSpace($requestedRef) -or $requestedRef -ne $requestedRef.Trim() -or $requestedRef.StartsWith('-')) {
            throw 'Invalid deployment ref'
          }
          git check-ref-format --branch $requestedRef
          if ($LASTEXITCODE -ne 0) { throw 'Invalid deployment ref' }
          if ($env:DEPLOY_TARGET -cnotin @('web', 'data-proxy', 'both')) { throw 'Invalid deployment target' }

      - name: Check out main dispatch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Set up deployment Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up deployment Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Preserve main deployment controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $control = Join-Path $env:RUNNER_TEMP 'transit-deploy-control'
          foreach ($asset in @('.nvmrc', '.bun-version', 'apps/data-proxy/r2-cors.json', 'apps/data-proxy/scripts/configure-data-edge.mjs')) {
            $destination = Join-Path $control $asset
            New-Item -ItemType Directory -Force -Path (Split-Path $destination) | Out-Null
            Copy-Item -LiteralPath $asset -Destination $destination
          }
          $wrangler = (Get-Content -Raw package.json | ConvertFrom-Json).devDependencies.wrangler
          if ($wrangler -cnotmatch '^[0-9]+[.][0-9]+[.][0-9]+$') { throw 'Invalid deployment Wrangler pin' }
          @{ private = $true; dependencies = @{ wrangler = $wrangler } } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $control 'package.json') -Encoding utf8

      - name: Check out deployment ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve deployed commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse --verify 'HEAD^{commit}').Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -cnotmatch '^[a-f0-9]{40}$') { throw 'Cannot resolve deployment commit' }
          "TRANSIT_COMMIT_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install selected application dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned deployment Wrangler
        run: bun install --cwd "$RUNNER_TEMP/transit-deploy-control" --ignore-scripts

      - name: Build production web
        if: inputs.target == 'web' || inputs.target == 'both'
        working-directory: apps/web
        run: bun run build

      - name: Apply public snapshot CORS
        working-directory: apps/data-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node "$RUNNER_TEMP/transit-deploy-control/node_modules/wrangler/bin/wrangler.js" r2 bucket cors set transit-snapshots --file "$RUNNER_TEMP/transit-deploy-control/apps/data-proxy/r2-cors.json" --force

      - name: Deploy production web Worker
        if: inputs.target == 'web' || inputs.target == 'both'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TRANSIT_BRANCH: ${{ inputs.ref }}
          PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PUBLIC_PLAUSIBLE_DOMAIN }}
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/deploy-web.ndjson
        run: >-
          node "$RUNNER_TEMP/transit-deploy-control/node_modules/wrangler/bin/wrangler.js" deploy
          --var "TRANSIT_COMMIT_SHA:$TRANSIT_COMMIT_SHA"
          --var "TRANSIT_BRANCH:$TRANSIT_BRANCH"
          ${PUBLIC_PLAUSIBLE_DOMAIN:+--var "PUBLIC_PLAUSIBLE_DOMAIN:$PUBLIC_PLAUSIBLE_DOMAIN"}
          ${PUBLIC_CF_BEACON_TOKEN:+--var "PUBLIC_CF_BEACON_TOKEN:$PUBLIC_CF_BEACON_TOKEN"}

      - name: Record web deployment
        if: inputs.target == 'web' || inputs.target == 'both'
        env:
          DEPLOY_TARGET: web
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/deploy-web.ndjson
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const records = readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, 'utf8')
            .trim().split('\n').map((line) => JSON.parse(line));
          const deployment = records.findLast((record) => record.type === 'deploy');
          if (!deployment?.version_id) throw new Error('Wrangler did not report a deployed Worker version');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Deployed SHA: ${process.env.TRANSIT_COMMIT_SHA}\n\nTarget: ${process.env.DEPLOY_TARGET}\n\nWorker version: ${deployment.version_id}\n\n`);
          NODE

      - name: Deploy production data proxy Worker
        if: inputs.target == 'data-proxy' || inputs.target == 'both'
        working-directory: apps/data-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/deploy-data-proxy.ndjson
        run: node "$RUNNER_TEMP/transit-deploy-control/node_modules/wrangler/bin/wrangler.js" deploy

      - name: Record data proxy deployment
        if: inputs.target == 'data-proxy' || inputs.target == 'both'
        env:
          DEPLOY_TARGET: data-proxy
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/deploy-data-proxy.ndjson
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const records = readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, 'utf8')
            .trim().split('\n').map((line) => JSON.parse(line));
          const deployment = records.findLast((record) => record.type === 'deploy');
          if (!deployment?.version_id) throw new Error('Wrangler did not report a deployed Worker version');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Deployed SHA: ${process.env.TRANSIT_COMMIT_SHA}\n\nTarget: ${process.env.DEPLOY_TARGET}\n\nWorker version: ${deployment.version_id}\n\n`);
          NODE

      - name: Configure direct R2 edge caching
        if: inputs.target == 'data-proxy' || inputs.target == 'both'
        working-directory: apps/data-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: 8a4ad7999bd6c2259b5b4acd52f39015
        run: node "$RUNNER_TEMP/transit-deploy-control/apps/data-proxy/scripts/configure-data-edge.mjs"
