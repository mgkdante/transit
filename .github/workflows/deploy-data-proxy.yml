name: Deploy Data Proxy Worker

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/data-proxy/**"
      - ".bun-version"
      - ".nvmrc"
      - ".github/actions/setup/action.yml"
      - ".github/workflows/deploy-data-proxy.yml"
      - "bun.lock"
      - "package.json"
  push:
    branches: [main, develop]
    paths:
      - "apps/data-proxy/**"
      - ".bun-version"
      - ".nvmrc"
      - ".github/actions/setup/action.yml"
      - ".github/workflows/deploy-data-proxy.yml"
      - "bun.lock"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: deploy-data-proxy
  cancel-in-progress: false

jobs:
  test-data-proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/data-proxy
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Run worker behavioral suite
        run: node --test "test/*.test.mjs"

  deploy-data-proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: test-data-proxy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: transit-data-edge-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/data-proxy
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JS workspace
        uses: ./.github/actions/setup

      - name: Deploy worker with wrangler
        run: ../../node_modules/.bin/wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply public snapshot CORS
        run: ../../node_modules/.bin/wrangler r2 bucket cors set transit-snapshots --file r2-cors.json --force
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Configure direct R2 edge caching
        run: node scripts/configure-data-edge.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: 8a4ad7999bd6c2259b5b4acd52f39015

      - name: Run production smoke
        run: bash smoke.sh
