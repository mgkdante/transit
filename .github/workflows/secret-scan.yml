name: secret-scan

on:
  merge_group:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          installed="$(bash .github/scripts/install-gitleaks.sh "${RUNNER_TEMP}/transit-gitleaks")"
          printf 'GITLEAKS_BIN=%s\n' "${installed}" >> "${GITHUB_ENV}"
          "${installed}" version

      - name: Scan current tree
        if: ${{ success() || failure() }}
        run: '"${GITLEAKS_BIN}" dir --redact --config .gitleaks.toml .'

      - name: Scan pull request diff
        if: ${{ (success() || failure()) && github.event_name == 'pull_request' }}
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}" --depth=200
          "${GITLEAKS_BIN}" detect --redact --config .gitleaks.toml --log-opts "origin/${{ github.base_ref }}..HEAD"

      - name: Scan merge group commits
        if: ${{ (success() || failure()) && github.event_name == 'merge_group' }}
        env:
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          if [[ "$MERGE_BASE" =~ ^[a-f0-9]{40}$ && "$MERGE_HEAD" =~ ^[a-f0-9]{40}$ ]] &&
             git cat-file -e "$MERGE_BASE^{commit}" && git cat-file -e "$MERGE_HEAD^{commit}"; then
            "${GITLEAKS_BIN}" detect --redact --config .gitleaks.toml --log-opts "$MERGE_BASE..$MERGE_HEAD"
          else
            "${GITLEAKS_BIN}" detect --redact --config .gitleaks.toml
          fi

      - name: Scan pushed commits
        if: ${{ (success() || failure()) && github.event_name == 'push' }}
        run: |
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            "${GITLEAKS_BIN}" detect --redact --config .gitleaks.toml
          else
            "${GITLEAKS_BIN}" detect --redact --config .gitleaks.toml --log-opts "$before..$after"
          fi

      - name: Scan HEAD history
        if: ${{ (success() || failure()) && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: '"${GITLEAKS_BIN}" detect --redact --config .gitleaks.toml'
