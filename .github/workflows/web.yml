name: web

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_e2e: ${{ steps.classify.outputs.run_e2e }}
      run_layout: ${{ steps.classify.outputs.run_layout }}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The trusted boundary covers policy code, not edits to this workflow, which need review.
      # This standalone policy imports only Node built-ins, with no load-time assets.
      # Extend the materialized closure for new imports/assets. Interface changes
      # need a two-step migration: land compatible base support, then use it.
      - name: Materialize trusted web policy
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch trusted main' }
          $base = (git rev-parse refs/remotes/origin/main).Trim()
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $event = Get-Content -Raw -LiteralPath $env:GITHUB_EVENT_PATH | ConvertFrom-Json
            $base = $event.pull_request.base.sha
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push') {
            $base = $env:GITHUB_SHA
          }
          if ($base -cnotmatch '^[a-f0-9]{40}$') { throw 'Invalid policy base SHA' }
          git merge-base --is-ancestor $base refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Policy base is not reachable from origin/main' }
          $policy = Join-Path $env:RUNNER_TEMP ('web-policy-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $policy | Out-Null
          foreach ($path in @('.nvmrc', '.github/scripts/web-ci-paths.mjs')) {
            $content = git show "${base}:$path"
            if ($LASTEXITCODE -ne 0) { throw "Missing trusted policy file: $path" }
            [IO.File]::WriteAllText((Join-Path $policy (Split-Path $path -Leaf)), ($content -join "`n") + "`n")
          }
          $pin = (Get-Content -Raw -LiteralPath (Join-Path $policy '.nvmrc')).Trim()
          if ($pin -cnotmatch '^[0-9]+[.][0-9]+[.][0-9]+$') { throw 'Invalid trusted Node pin' }
          "WEB_CI_NODE=$pin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WEB_CI_POLICY=$policy" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.WEB_CI_NODE }}
          package-manager-cache: false

      - name: Classify web paths
        id: classify
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -ne 'pull_request') {
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "run_e2e=true`nrun_layout=true`n")
            exit 0
          }
          node "$env:WEB_CI_POLICY/web-ci-paths.mjs" classify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  prerelease-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Test design prerelease guard
        run: node .github/scripts/design-prerelease-guard.mjs --self-test

      - name: Require stable design dependencies
        run: node .github/scripts/design-prerelease-guard.mjs

  ci-work:
    outputs:
      artifact_id: ${{ steps.upload_build.outputs.artifact-id }}
      manifest_sha256: ${{ steps.seal_build.outputs.manifest_sha256 }}
      producer_attempt: ${{ steps.seal_build.outputs.producer_attempt }}
      build_target: ${{ steps.build_target.outputs.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JS workspace
        uses: ./.github/actions/setup

      - name: Data proxy syntax
        working-directory: ${{ github.workspace }}
        run: bun run --cwd apps/data-proxy check

      - name: Data proxy unit tests
        working-directory: ${{ github.workspace }}
        run: bun run --cwd apps/data-proxy test

      - name: Data proxy Wrangler dry run
        working-directory: apps/data-proxy
        run: ../../node_modules/.bin/wrangler deploy --dry-run

      - name: Web CI policy contract
        working-directory: ${{ github.workspace }}
        run: node --test .github/scripts/web-ci-paths.test.mjs .github/scripts/web-ci-trusted.test.mjs

      - name: Deployment scope contract
        working-directory: ${{ github.workspace }}
        run: node --test .github/scripts/deploy-scope.test.mjs

      - name: Public site probe contract
        working-directory: ${{ github.workspace }}
        run: node --test .github/scripts/site-probe.test.mjs .github/scripts/site-probe-weekly.test.mjs .github/scripts/site-probe-non-sending.test.mjs

      - name: Install pinned Linux lychee
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/install-lychee.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify pinned lychee version and real argument parsing
        working-directory: ${{ github.workspace }}
        run: node .github/scripts/verify-lychee.mjs

      - name: Basemap replacement transaction contract
        working-directory: ${{ github.workspace }}
        run: node --test .github/scripts/refresh-basemap-r2.test.mjs

      - name: OG drift gate
        run: bun run og:check

      - name: Icon drift gate
        run: bun run icons:check

      - name: Map poster drift gate
        run: bun run map-posters:check

      - name: Lint + format
        run: |
          bun run lint
          bun run format:check

      - name: Brand gates
        run: bun run lint:design

      - name: Type-check
        run: bun run check

      - name: Build artifact contract
        working-directory: ${{ github.workspace }}
        run: node --test .github/scripts/web-build-artifact.test.mjs

      - name: Select build target
        id: build_target
        working-directory: ${{ github.workspace }}
        run: node .github/scripts/web-build-artifact.mjs configure

      - name: Build (adapter-cloudflare)
        run: bun run build

      - name: Seal deployment build
        if: ${{ steps.build_target.outputs.target != 'verification' }}
        id: seal_build
        working-directory: ${{ github.workspace }}
        env:
          TRANSIT_BUILD_TARGET: ${{ steps.build_target.outputs.target }}
        run: node .github/scripts/web-build-artifact.mjs prepare "$RUNNER_TEMP/transit-web-build"

      - name: Web Wrangler dry run
        run: ../../node_modules/.bin/wrangler deploy --dry-run

      - name: Browser toolchain contract
        run: node --test scripts/install-browser-toolchain.test.mjs

      - name: Install authenticated Chromium
        env:
          TRANSIT_BROWSER_ROOT: ${{ runner.temp }}/transit-browser-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir --mode=0700 -- "$TRANSIT_BROWSER_ROOT"
          node scripts/install-browser-toolchain.mjs "$TRANSIT_BROWSER_ROOT"
          printf 'TRANSIT_BROWSER_ROOT=%s\n' "$TRANSIT_BROWSER_ROOT" >> "$GITHUB_ENV"

      - name: B9 displayed-value correctness
        env:
          B9_REUSE_BUILD: "1"
        run: bun run test:b9-display

      - name: Verify sealed build after checks
        if: ${{ steps.build_target.outputs.target != 'verification' }}
        working-directory: ${{ github.workspace }}
        env:
          TRANSIT_BUILD_TARGET: ${{ steps.build_target.outputs.target }}
          TRANSIT_EXPECTED_MANIFEST_SHA256: ${{ steps.seal_build.outputs.manifest_sha256 }}
        run: node .github/scripts/web-build-artifact.mjs verify-source "$RUNNER_TEMP/transit-web-build"

      - name: Upload verified deployment build
        if: ${{ steps.build_target.outputs.target != 'verification' }}
        id: upload_build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: transit-web-${{ github.sha }}-${{ steps.build_target.outputs.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/transit-web-build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JS workspace
        uses: ./.github/actions/setup
        with:
          cache-vitest: "true"

      - name: Unit tests
        run: bun run test

  e2e:
    needs: [classify]
    if: ${{ !cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.run_e2e != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JS workspace
        uses: ./.github/actions/setup

      - name: Install authenticated Chromium
        env:
          TRANSIT_BROWSER_ROOT: ${{ runner.temp }}/transit-browser-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir --mode=0700 -- "$TRANSIT_BROWSER_ROOT"
          node scripts/install-browser-toolchain.mjs "$TRANSIT_BROWSER_ROOT"
          printf 'TRANSIT_BROWSER_ROOT=%s\n' "$TRANSIT_BROWSER_ROOT" >> "$GITHUB_ENV"

      - name: e2e
        run: bun run test:e2e --shard=${{ matrix.shard }}/3

      - name: Upload e2e failure evidence
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: transit-e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 7

  layout:
    needs: [classify]
    if: ${{ !cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.run_layout != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JS workspace
        uses: ./.github/actions/setup

      - name: Install authenticated Chromium
        env:
          TRANSIT_BROWSER_ROOT: ${{ runner.temp }}/transit-browser-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir --mode=0700 -- "$TRANSIT_BROWSER_ROOT"
          node scripts/install-browser-toolchain.mjs "$TRANSIT_BROWSER_ROOT"
          printf 'TRANSIT_BROWSER_ROOT=%s\n' "$TRANSIT_BROWSER_ROOT" >> "$GITHUB_ENV"

      # WebKit needs ~114 MB of Ubuntu packages. The Ubuntu mirror sometimes serves them
      # at a few hundred kB/s, which stalls a shard for minutes, so keep the packages and
      # the WebKit build between runs. apt still verifies every cached package.
      - name: Restore WebKit cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/transit-apt-archives
          key: ${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-webkit-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-webkit-

      - name: Install WebKit dependencies
        run: |
          archives="$HOME/.cache/transit-apt-archives"
          mkdir -p -- "$archives/partial"
          printf 'Dir::Cache::archives "%s/";\nAPT::Keep-Downloaded-Packages "true";\nBinary::apt-get::APT::Keep-Downloaded-Packages "true";\nAPT::Sandbox::User "root";\n' "$archives" \
            | sudo tee /etc/apt/apt.conf.d/99transit-archives > /dev/null
          bun x playwright install --with-deps webkit
          sudo rm -f -- "$archives/lock"
          sudo chown -R "$(id -u):$(id -g)" -- "$archives"

      - name: layout
        run: bun run test:e2e:layout --shard=${{ matrix.shard }}/4

      - name: Upload e2e failure evidence
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: transit-layout-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 7

  ci:
    name: ci
    needs: [classify, prerelease-guard, ci-work, unit, e2e, layout]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The trusted boundary covers policy code, not edits to this workflow, which need review.
      # This standalone policy imports only Node built-ins, with no load-time assets.
      # Extend the materialized closure for new imports/assets. Interface changes
      # need a two-step migration: land compatible base support, then use it.
      - name: Materialize trusted web policy
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch trusted main' }
          $base = (git rev-parse refs/remotes/origin/main).Trim()
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $event = Get-Content -Raw -LiteralPath $env:GITHUB_EVENT_PATH | ConvertFrom-Json
            $base = $event.pull_request.base.sha
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push') {
            $base = $env:GITHUB_SHA
          }
          if ($base -cnotmatch '^[a-f0-9]{40}$') { throw 'Invalid policy base SHA' }
          git merge-base --is-ancestor $base refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Policy base is not reachable from origin/main' }
          $policy = Join-Path $env:RUNNER_TEMP ('web-policy-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $policy | Out-Null
          foreach ($path in @('.nvmrc', '.github/scripts/web-ci-paths.mjs')) {
            $content = git show "${base}:$path"
            if ($LASTEXITCODE -ne 0) { throw "Missing trusted policy file: $path" }
            [IO.File]::WriteAllText((Join-Path $policy (Split-Path $path -Leaf)), ($content -join "`n") + "`n")
          }
          $pin = (Get-Content -Raw -LiteralPath (Join-Path $policy '.nvmrc')).Trim()
          if ($pin -cnotmatch '^[0-9]+[.][0-9]+[.][0-9]+$') { throw 'Invalid trusted Node pin' }
          "WEB_CI_NODE=$pin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WEB_CI_POLICY=$policy" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.WEB_CI_NODE }}
          package-manager-cache: false

      - name: Require selected jobs to succeed
        working-directory: ${{ github.workspace }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: pwsh
        run: |
          $needs = $env:NEEDS_JSON | ConvertFrom-Json -AsHashtable
          foreach ($job in $needs.Keys) {
            if ($needs[$job].result -in @('failure', 'cancelled')) {
              throw "${job}: $($needs[$job].result)"
            }
          }
          # Older base policies have no run_layout output and permit docs-only skips.
          # Require explicit base classification even when that policy predates layout gating.
          if ($needs.layout.result -eq 'skipped' -and $needs.classify.outputs.run_layout -cne 'false') {
            throw 'layout: skipped without explicit run_layout=false'
          }
          node "$env:WEB_CI_POLICY/web-ci-paths.mjs" required
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  deploy_scope:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      deploy_web: ${{ steps.scope.outputs.deploy_web }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Resolve deployable event diff
        id: scope
        working-directory: ${{ github.workspace }}
        env:
          TRANSIT_DEPLOY_EVENT: ${{ github.event_name }}
          TRANSIT_DEPLOY_BEFORE: ${{ github.event.before }}
          TRANSIT_DEPLOY_AFTER: ${{ github.sha }}
        run: node .github/scripts/deploy-scope.mjs >> "$GITHUB_OUTPUT"

  preview:
    name: preview
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JS workspace
        uses: ./.github/actions/setup

      - name: Build (adapter-cloudflare)
        run: bun run build

      # Uploads a version without deploying it; production traffic is untouched.
      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # checkout builds the PR merge ref, not the feature-branch head.
          TRANSIT_COMMIT_SHA: ${{ github.sha }}
          TRANSIT_BRANCH: ${{ github.head_ref }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          ../../node_modules/.bin/wrangler versions upload --preview-alias "pr-$PR_NUMBER" \
            --message "Preview of PR #$PR_NUMBER, never deploy" --var PUBLIC_INDEXING:false \
            --var "TRANSIT_COMMIT_SHA:$TRANSIT_COMMIT_SHA" --var "TRANSIT_BRANCH:$TRANSIT_BRANCH"
          url="$(jq -r 'select(.type == "version-upload") | .preview_alias_url // empty' "$WRANGLER_OUTPUT_FILE_PATH")"
          if [ -z "$url" ]; then
            echo "::error::No preview URL: Version URLs are off for transit-web until a production deploy applies preview_urls = true."
            exit 1
          fi
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
          printf 'Preview for PR #%s: %s\n' "$PR_NUMBER" "$url" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: deploy production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [ci, deploy_scope, ci-work]
    if: >-
      ${{ !cancelled() && needs.ci.result == 'success' && needs.deploy_scope.result == 'success' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'workflow_dispatch' || needs.deploy_scope.outputs.deploy_web == 'true') }}
    environment: production
    env:
      TRANSIT_BUILD_TARGET: production
      PUBLIC_SITE_ORIGIN: https://transit.yesid.dev
      PUBLIC_V1_BASE: https://data.yesid.dev/v1
      PUBLIC_INDEXING: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JS workspace
        uses: ./.github/actions/setup

      - name: Require the producer artifact
        env:
          TRANSIT_ARTIFACT_ID: ${{ needs.ci-work.outputs.artifact_id }}
          TRANSIT_MANIFEST_SHA256: ${{ needs.ci-work.outputs.manifest_sha256 }}
          TRANSIT_PRODUCER_ATTEMPT: ${{ needs.ci-work.outputs.producer_attempt }}
          TRANSIT_PRODUCER_TARGET: ${{ needs.ci-work.outputs.build_target }}
        run: |
          [[ "$TRANSIT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$TRANSIT_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$TRANSIT_PRODUCER_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test "$TRANSIT_PRODUCER_TARGET" = "$TRANSIT_BUILD_TARGET"

      - name: Download the producer artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.ci-work.outputs.artifact_id }}
          path: ${{ runner.temp }}/transit-web-build
          merge-multiple: true
          digest-mismatch: error

      - name: Restore the verified deployment build
        working-directory: ${{ github.workspace }}
        env:
          TRANSIT_EXPECTED_MANIFEST_SHA256: ${{ needs.ci-work.outputs.manifest_sha256 }}
          TRANSIT_PRODUCER_ATTEMPT: ${{ needs.ci-work.outputs.producer_attempt }}
        run: node .github/scripts/web-build-artifact.mjs restore "$RUNNER_TEMP/transit-web-build"

      - name: Apply public snapshot CORS
        working-directory: apps/data-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ../../node_modules/.bin/wrangler r2 bucket cors set transit-snapshots --file r2-cors.json --force

      - name: Deploy production Worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PUBLIC_PLAUSIBLE_DOMAIN }}
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
          TRANSIT_COMMIT_SHA: ${{ github.sha }}
          TRANSIT_BRANCH: ${{ github.ref_name }}
        run: >-
          ../../node_modules/.bin/wrangler deploy
          --var "TRANSIT_COMMIT_SHA:$TRANSIT_COMMIT_SHA"
          --var "TRANSIT_BRANCH:$TRANSIT_BRANCH"
          ${PUBLIC_PLAUSIBLE_DOMAIN:+--var "PUBLIC_PLAUSIBLE_DOMAIN:$PUBLIC_PLAUSIBLE_DOMAIN"}
          ${PUBLIC_CF_BEACON_TOKEN:+--var "PUBLIC_CF_BEACON_TOKEN:$PUBLIC_CF_BEACON_TOKEN"}

      - name: Verify shared production routes
        working-directory: apps/data-proxy
        run: bash smoke.sh
