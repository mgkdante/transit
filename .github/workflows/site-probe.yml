name: Public Site Probe

on:
  workflow_dispatch:
    inputs:
      check_links:
        description: "Check weekly cross-site links (read-only)"
        type: boolean
        default: false
  schedule:
    - cron: "4,19,34,49 * * * *"
    # Weekly read-only link check, no contact submission.
    - cron: "37 10 * * 1"

permissions:
  contents: read
  issues: write

concurrency:
  group: site-probe
  cancel-in-progress: false

jobs:
  sites:
    if: ${{ github.event.schedule != '37 10 * * 1' && inputs.check_links != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check public sites and update the alert issue
        run: node .github/scripts/site-probe.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  weekly:
    if: ${{ github.run_attempt == 1 && (github.event.schedule == '37 10 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.check_links == true)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pinned lychee
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/lychee"
          gh release download lychee-v0.24.2 --repo lycheeverse/lychee --pattern lychee-x86_64-unknown-linux-gnu.tar.gz --dir "$RUNNER_TEMP/lychee"
          cd "$RUNNER_TEMP/lychee"
          echo '1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  lychee-x86_64-unknown-linux-gnu.tar.gz' | sha256sum --check
          tar -xzf lychee-x86_64-unknown-linux-gnu.tar.gz
          echo "$RUNNER_TEMP/lychee" >> "$GITHUB_PATH"
      - name: Weekly cross-site link checks
        run: node .github/scripts/site-probe.mjs --weekly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROBE_SCHEDULE: ${{ github.event.schedule }}
          LINK_CHECK: ${{ inputs.check_links }}
