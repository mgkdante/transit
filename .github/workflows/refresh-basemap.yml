name: Refresh Basemap Extract


on:
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC, 1st of each month
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider id; blank refreshes publicly ready providers"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: refresh-basemap
  cancel-in-progress: false

env:
  PMTILES_VERSION: "1.30.3"
  MAXZOOM: "15"
  R2_BUCKET: "transit-snapshots"

jobs:
  providers:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-py
      - id: config
        working-directory: apps/db
        env:
          REQUESTED_PROVIDER: ${{ inputs.provider }}
        run: |
          uv run python - <<'PY'
          import json, os
          from pathlib import PurePosixPath
          from transit_ops.providers.registry import ProviderRegistry
          registry = ProviderRegistry.from_project_root()
          requested = os.environ.get("REQUESTED_PROVIDER")
          ids = [requested] if requested else registry.list_provider_ids()
          jobs = []
          for provider_id in ids:
              public = registry.get_provider(provider_id).public
              if not requested and not public.enabled:
                  continue
              bounds = public.basemap_bounds
              if not bounds or not public.basemap_url:
                  raise ValueError(f"Missing basemap configuration: {provider_id}")
              prefix = f"/data/v1/{provider_id}/static/basemap/"
              if not public.basemap_url.startswith(prefix):
                  raise ValueError(f"Foreign basemap path: {provider_id}")
              coordinates = [
                  bounds.min_longitude, bounds.min_latitude,
                  bounds.max_longitude, bounds.max_latitude,
              ]
              jobs.append({
                  "provider": provider_id,
                  "bbox": ",".join(map(str, coordinates)),
                  "key": public.basemap_url.removeprefix("/data/"),
                  "file": PurePosixPath(public.basemap_url).name,
              })
          if not jobs:
              raise ValueError("No providers selected")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps({"include": jobs}) + "\n")
          PY

  refresh-basemap:
    needs: providers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.providers.outputs.matrix) }}
    env:
      BBOX: ${{ matrix.bbox }}
      R2_KEY: ${{ matrix.key }}
      EXTRACT_FILE: ${{ matrix.file }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install go-pmtiles
        run: |
          curl -sSfL "https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES_VERSION}/go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz" -o /tmp/go-pmtiles.tar.gz
          echo "adda9f979b719416d0c0069f57401a21c32078c46870a94f9bbda95d850f199f  /tmp/go-pmtiles.tar.gz" | sha256sum -c -
          tar -xzf /tmp/go-pmtiles.tar.gz pmtiles
          sudo mv pmtiles /usr/local/bin/
          pmtiles version

      - name: Extract provider area from the latest Protomaps daily build
        run: |
          DATE="$(date -u -d 'yesterday' +%Y%m%d)"
          SRC="https://build.protomaps.com/${DATE}.pmtiles"
          echo "Extracting bbox=${BBOX} maxzoom=${MAXZOOM} from ${SRC}"
          timeout 5m pmtiles extract "${SRC}" "${EXTRACT_FILE}" --bbox="${BBOX}" --maxzoom="${MAXZOOM}"

      - name: Verify the extract (fail loudly on regress)
        run: |
          timeout 2m pmtiles verify "${EXTRACT_FILE}"
          timeout 2m pmtiles show "${EXTRACT_FILE}"
          SIZE="$(stat -c%s "${EXTRACT_FILE}")"
          echo "extract size: ${SIZE} bytes"
          test "${SIZE}" -gt 100000

      - name: Set up JS workspace
        uses: ./.github/actions/setup

      - name: Replace the stable R2 object with verified backup and readback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: eccfb9bedd87d413eaf4cac6ae2285d3
          WRANGLER_BIN: ${{ github.workspace }}/node_modules/.bin/wrangler
        run: |
          BACKUP_KEY="${R2_KEY%/*}/backups/${EXTRACT_FILE%.pmtiles}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-before.pmtiles"
          bun .github/scripts/refresh-basemap-r2.mjs \
            --bucket="${R2_BUCKET}" \
            --key="${R2_KEY}" \
            --backup-key="${BACKUP_KEY}" \
            --new-file="${EXTRACT_FILE}" \
            --receipt="${RUNNER_TEMP}/basemap-refresh-receipt.json"
          cat "${RUNNER_TEMP}/basemap-refresh-receipt.json"
