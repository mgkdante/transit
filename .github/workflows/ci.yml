name: CI

# Replays migrations and real-DB tests on disposable PostgreSQL.
on:
  merge_group:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".env.example"
      - ".gitleaks.toml"
      - "apps/db/**"
      - ".github/workflows/**"
      - ".github/scripts/**"
      - ".github/actions/**"
      - ".bun-version"
      - ".python-version"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/db

env:
  COLUMNS: "200"

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    outputs:
      run_db: ${{ steps.classify.outputs.run_db }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Test DB path selection
        run: node --test .github/scripts/ci-paths.test.mjs

      - name: Classify DB paths
        id: classify
        run: node .github/scripts/ci-paths.mjs classify

  offline-tests-work:
    needs: [classify]
    if: ${{ needs.classify.outputs.run_db == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python workspace
        uses: ./.github/actions/setup-py

      - name: Run offline test suite
        run: uv run pytest tests

      - name: Ruff
        run: uv run ruff check src tests

      - name: Strict Python typing
        run: uv run mypy

  # Require one Alembic head so empty-DB replay and production init-db can succeed.
  alembic-single-head-work:
    needs: [classify]
    if: ${{ needs.classify.outputs.run_db == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python workspace
        uses: ./.github/actions/setup-py

      - name: Assert a single alembic head
        run: |
          heads="$(uv run alembic heads 2>/dev/null | grep -c '(head)' || true)"
          echo "alembic heads reporting (head): ${heads}"
          if [ "${heads}" != "1" ]; then
            echo "::error::Expected exactly one alembic head, found ${heads}." >&2
            uv run alembic heads
            exit 1
          fi

  real-db-tests-work:
    needs: [classify]
    if: ${{ needs.classify.outputs.run_db == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: transit_ci
          POSTGRES_PASSWORD: transit_ci
          POSTGRES_DB: transit_ci
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U transit_ci -d transit_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://transit_ci:transit_ci@127.0.0.1:5432/transit_ci
      TRANSIT_TEST_DATABASE_URL: postgresql+psycopg://transit_ci:transit_ci@127.0.0.1:5432/transit_ci
      TRANSIT_TEST_DATABASE_DISPOSABLE: I_UNDERSTAND_THIS_DATABASE_IS_DISPOSABLE
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python workspace
        uses: ./.github/actions/setup-py

      - name: Verify runtime container toolchain
        run: bash scripts/verify-runtime-images.sh
        working-directory: apps/db

      - name: Replay migrations on disposable PostgreSQL
        run: |
          unset PGHOST PGHOSTADDR PGPORT PGDATABASE PGUSER PGSERVICE PGSERVICEFILE
          uv run alembic upgrade head
        working-directory: apps/db

      - name: Run real-DB test suite
        run: |
          unset PGHOST PGHOSTADDR PGPORT PGDATABASE PGUSER PGSERVICE PGSERVICEFILE
          uv run pytest tests -n 4 --dist worksteal --max-worker-restart=0 --durations=20
        working-directory: apps/db

  required-contexts:
    needs:
      [
        classify,
        offline-tests-work,
        alembic-single-head-work,
        real-db-tests-work,
      ]
    if: ${{ always() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: offline-tests
          - context: alembic-single-head
          - context: real-db-tests
    name: ${{ matrix.context }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Require selected DB checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-paths.mjs required
