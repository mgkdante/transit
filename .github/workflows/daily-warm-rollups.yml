name: Daily Warm Rollups

on:
  workflow_dispatch:
    inputs:
      bronze_catch_up_batches:
        description: "One-off bronze backlog drain: up to this many 5,000-object batches per provider, without a historic publish. 0 runs the normal pipeline."
        type: number
        default: 0
  schedule:
    - cron: "0 7 * * 0,1,2,4,5,6"
    - cron: "0 7 * * 3"

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-warm-rollups
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/db
        shell: bash
    outputs:
      providers: ${{ steps.discover.outputs.providers }}
      prepare_artifact_id: ${{ steps.upload-prepare-evidence.outputs.artifact-id }}
      # Historic publishes weekly; prepare, rollups and retention stay daily.
      historic_publish: ${{ (github.event_name == 'workflow_dispatch' && inputs.bronze_catch_up_batches == 0) || github.event.schedule == '0 7 * * 3' }}
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PROVIDER_TIMEZONE: America/Toronto
      STM_PROVIDER_ID: stm
      BRONZE_STORAGE_BACKEND: s3
      BRONZE_S3_ENDPOINT: https://eccfb9bedd87d413eaf4cac6ae2285d3.r2.cloudflarestorage.com
      BRONZE_S3_BUCKET: transit-raw
      BRONZE_S3_REGION: auto
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BRONZE_S3_ACCESS_KEY: ${{ secrets.BRONZE_S3_ACCESS_KEY }}
      BRONZE_S3_SECRET_KEY: ${{ secrets.BRONZE_S3_SECRET_KEY }}
      SNAPSHOT_STORAGE_BACKEND: s3
      SNAPSHOT_R2_BUCKET: ${{ secrets.SNAPSHOT_R2_BUCKET }}
      SNAPSHOT_PUBLIC_BASE_URL: ${{ secrets.SNAPSHOT_PUBLIC_BASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python workspace
        uses: ./.github/actions/setup-py

      - name: Prepare database and sync alert archive
        id: discover
        run: uv run python -m transit_ops.cli daily-run prepare

      - name: Upload prepare evidence
        id: upload-prepare-evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: daily-warm-prepare-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/db/artifacts/daily-warm-rollups/prepare/
          retention-days: 30
          if-no-files-found: warn

  rollups:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 325
    defaults:
      run:
        working-directory: apps/db
        shell: bash
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PROVIDER_TIMEZONE: America/Toronto
      STM_PROVIDER_ID: stm
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PROVIDER_PLAN: ${{ needs.prepare.outputs.providers }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python workspace
        uses: ./.github/actions/setup-py

      - name: Build warm rollups
        timeout-minutes: 310
        run: uv run python -m transit_ops.cli daily-run rollups

      - name: Upload rollup receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: daily-warm-rollups-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/db/artifacts/daily-warm-rollups/rollups/
          retention-days: 30
          if-no-files-found: warn

  publish:
    needs: [prepare, rollups]
    if: ${{ always() && needs.prepare.result == 'success' && needs.rollups.result == 'success' && needs.prepare.outputs.historic_publish == 'true' }}
    runs-on: ubuntu-24.04
    # Up to three concurrent providers, each with its own unchanged 90m bound.
    timeout-minutes: 285
    outputs:
      publish_artifact_id: ${{ steps.upload-publish-evidence.outputs.artifact-id }}
    defaults:
      run:
        working-directory: apps/db
        shell: bash
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PROVIDER_TIMEZONE: America/Toronto
      STM_PROVIDER_ID: stm
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BRONZE_STORAGE_BACKEND: s3
      BRONZE_S3_ENDPOINT: https://eccfb9bedd87d413eaf4cac6ae2285d3.r2.cloudflarestorage.com
      BRONZE_S3_BUCKET: transit-raw
      BRONZE_S3_REGION: auto
      BRONZE_S3_ACCESS_KEY: ${{ secrets.BRONZE_S3_ACCESS_KEY }}
      BRONZE_S3_SECRET_KEY: ${{ secrets.BRONZE_S3_SECRET_KEY }}
      SNAPSHOT_STORAGE_BACKEND: s3
      SNAPSHOT_R2_BUCKET: ${{ secrets.SNAPSHOT_R2_BUCKET }}
      SNAPSHOT_PUBLIC_BASE_URL: ${{ secrets.SNAPSHOT_PUBLIC_BASE_URL }}
      SNAPSHOT_BASEMAP_STYLE_URL: ${{ vars.SNAPSHOT_BASEMAP_STYLE_URL }}
      SNAPSHOT_PUBLISH_CONCURRENCY: "64"
      PGOPTIONS: "-c work_mem=256MB"
      PROVIDER_PLAN: ${{ needs.prepare.outputs.providers }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python workspace
        uses: ./.github/actions/setup-py

      - name: Publish gated historic snapshot
        timeout-minutes: 275
        run: uv run python -m transit_ops.cli daily-run publish

      - name: Upload publish evidence
        id: upload-publish-evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: daily-warm-publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/db/artifacts/daily-warm-rollups/publish/
          retention-days: 30
          if-no-files-found: warn

  proof:
    needs: [prepare, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    # Three configured providers, each retaining its 35-minute proof deadline.
    timeout-minutes: 115
    defaults:
      run:
        working-directory: apps/db
        shell: bash
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PROVIDER_TIMEZONE: America/Toronto
      STM_PROVIDER_ID: stm
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BRONZE_STORAGE_BACKEND: s3
      BRONZE_S3_ENDPOINT: https://eccfb9bedd87d413eaf4cac6ae2285d3.r2.cloudflarestorage.com
      BRONZE_S3_BUCKET: transit-raw
      BRONZE_S3_REGION: auto
      BRONZE_S3_ACCESS_KEY: ${{ secrets.BRONZE_S3_ACCESS_KEY }}
      BRONZE_S3_SECRET_KEY: ${{ secrets.BRONZE_S3_SECRET_KEY }}
      SNAPSHOT_STORAGE_BACKEND: s3
      SNAPSHOT_R2_BUCKET: ${{ secrets.SNAPSHOT_R2_BUCKET }}
      SNAPSHOT_PUBLIC_BASE_URL: ${{ secrets.SNAPSHOT_PUBLIC_BASE_URL }}
      SNAPSHOT_BASEMAP_STYLE_URL: ${{ vars.SNAPSHOT_BASEMAP_STYLE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python workspace
        uses: ./.github/actions/setup-py

      - name: Validate proof artifact handoff
        env:
          PREPARE_ARTIFACT_ID: ${{ needs.prepare.outputs.prepare_artifact_id }}
          PUBLISH_ARTIFACT_ID: ${{ needs.publish.outputs.publish_artifact_id }}
        run: uv run python -m transit_ops.cli daily-run check-handoff

      - name: Download alert archive receipts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.prepare_artifact_id }}
          path: apps/db/artifacts/daily-warm-rollups/prepare

      - name: Download publish evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.publish.outputs.publish_artifact_id }}
          path: apps/db/artifacts/daily-warm-rollups/publish

      - name: Prove public historic snapshots and source messages
        run: uv run python -m transit_ops.cli daily-run proof

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: daily-warm-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/db/artifacts/daily-warm-rollups/proof/
          retention-days: 30
          if-no-files-found: warn

  retention:
    needs: [prepare, rollups, proof]
    # Bronze inflow outpaces one day's prune budget, so non-publish days still prune.
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' && needs.rollups.result == 'success'
      && (needs.proof.result == 'success'
      || (needs.proof.result == 'skipped' && needs.prepare.outputs.historic_publish == 'false')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.bronze_catch_up_batches > 0 && 350 || 150 }}
    defaults:
      run:
        working-directory: apps/db
        shell: bash
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PROVIDER_TIMEZONE: America/Toronto
      STM_PROVIDER_ID: stm
      BRONZE_STORAGE_BACKEND: s3
      BRONZE_S3_ENDPOINT: https://eccfb9bedd87d413eaf4cac6ae2285d3.r2.cloudflarestorage.com
      BRONZE_S3_BUCKET: transit-raw
      BRONZE_S3_REGION: auto
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BRONZE_S3_ACCESS_KEY: ${{ secrets.BRONZE_S3_ACCESS_KEY }}
      BRONZE_S3_SECRET_KEY: ${{ secrets.BRONZE_S3_SECRET_KEY }}
      PROVIDER_PLAN: ${{ needs.prepare.outputs.providers }}
      BRONZE_CATCH_UP_BATCHES: ${{ inputs.bronze_catch_up_batches || 0 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python workspace
        uses: ./.github/actions/setup-py

      - name: Prune retained storage and write proofs
        timeout-minutes: ${{ inputs.bronze_catch_up_batches > 0 && 340 || 130 }}
        run: uv run python -m transit_ops.cli daily-run retention

      - name: Upload retention receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: daily-warm-retention-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/db/artifacts/daily-warm-rollups/retention/
          retention-days: 30
          if-no-files-found: warn

  notify:
    needs: [prepare, rollups, publish, proof, retention]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Update daily warm rollups issue
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          ROLLUPS_RESULT: ${{ needs.rollups.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PROOF_RESULT: ${{ needs.proof.result }}
          RETENTION_RESULT: ${{ needs.retention.result }}
          HISTORIC_PUBLISH: ${{ needs.prepare.outputs.historic_publish }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/daily-warm-notify.py
