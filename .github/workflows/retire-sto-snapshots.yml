name: Retire STO Snapshot Prefix

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RETIRE-STO-PUBLIC-SNAPSHOTS"
        required: true
        type: string

concurrency:
  group: retire-sto-snapshots
  cancel-in-progress: false

jobs:
  retire-sto-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      - name: Back up, verify, and retire the STO prefix
        timeout-minutes: 20
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BRONZE_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BRONZE_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_CLI_CONNECT_TIMEOUT: "10"
          AWS_CLI_READ_TIMEOUT: "60"
          AWS_MAX_ATTEMPTS: "5"
          SNAPSHOT_BUCKET: ${{ secrets.SNAPSHOT_R2_BUCKET }}
          BACKUP_BUCKET: transit-raw
          S3_ENDPOINT: https://eccfb9bedd87d413eaf4cac6ae2285d3.r2.cloudflarestorage.com
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: 8a4ad7999bd6c2259b5b4acd52f39015
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = 'RETIRE-STO-PUBLIC-SNAPSHOTS'
          test "$GITHUB_REF" = 'refs/heads/main'
          command -v aws >/dev/null
          command -v gh >/dev/null
          command -v jq >/dev/null

          source_prefix='v1/sto/'
          backup_root='retired-public-snapshots/sto/phase3-public-retirement/'
          backup_data_prefix="${backup_root}data/"
          backup_evidence_prefix="${backup_root}evidence/"
          durable_manifest_key="${backup_evidence_prefix}full-manifest.json"
          durable_receipt_key="${backup_evidence_prefix}retirement-receipt.json"
          publisher_workflows=(
            daily-static-pipeline.yml
            daily-warm-rollups.yml
            historic-publish-recovery.yml
            historic-snapshot-gc.yml
          )
          purge_payload="$(
            jq -cn '{prefixes:["data.yesid.dev/v1/","transit.yesid.dev/data/v1/"]}'
          )"

          inventory_prefix() {
            local bucket="$1"
            local prefix="$2"
            local output="$3"
            aws --endpoint-url "$S3_ENDPOINT" s3api list-objects-v2 \
              --bucket "$bucket" --prefix "$prefix" --output json \
              | jq -S --arg prefix "$prefix" \
                '[.Contents[]? | {Key:(.Key | ltrimstr($prefix)), Size, ETag}] | sort_by(.Key)' \
              > "$output"
          }

          assert_publishers_idle() {
            local workflow runs
            for workflow in "${publisher_workflows[@]}"; do
              runs="$(
                gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
                  --limit 100 --json databaseId,headSha,status,url
              )"
              if ! jq -e 'all(.[]; .status == "completed")' <<< "$runs" >/dev/null; then
                echo "::error title=Active snapshot publisher::$workflow still has a live run"
                jq -c '.[] | select(.status != "completed")' <<< "$runs" >&2
                return 1
              fi
            done
          }

          purge_cache() {
            local payload="$1"
            local response
            response="$(
              curl --fail-with-body --max-time 30 \
                --retry 4 --retry-all-errors --retry-delay 2 -sS \
                -X POST \
                "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H 'Content-Type: application/json' \
                --data "$payload"
            )"
            jq -e '.success == true and ((.errors // []) | length == 0)' \
              <<< "$response" >/dev/null
            printf '%s\n' "$response"
          }

          assert_quarantined() {
            local method retired_status retired_url
            for retired_url in \
              'https://data.yesid.dev/v1/sto/static/routes_index.json' \
              'https://data.yesid.dev/v1/sto%2Fstatic/routes_index.json' \
              'https://data.yesid.dev/v1/%73to/static/routes_index.json' \
              'https://transit.yesid.dev/data/v1/sto/static/routes_index.json' \
              'https://transit.yesid.dev/data/v1/%73to/static/routes_index.json'; do
              for method in GET HEAD; do
                if [[ "$method" == HEAD ]]; then
                  retired_status="$(
                    curl --path-as-is --max-time 15 -sS -I \
                      -o /dev/null -w '%{http_code}' "$retired_url"
                  )"
                else
                  retired_status="$(
                    curl --path-as-is --max-time 15 -sS \
                      -o /dev/null -w '%{http_code}' "$retired_url"
                  )"
                fi
                test "$retired_status" = '410'
              done
            done
          }

          source_is_backed_up() {
            jq -e --slurp '
              .[0] as $source
              | .[1] as $full
              | ($full | length) > 0
                and all($source[]; . as $item | any($full[]; . == $item))
            ' "$1" "$2" >/dev/null
          }

          # Quarantine every raw/encoded STO alias before storage mutation.
          assert_quarantined
          assert_publishers_idle

          # Prove cache-purge permission before any delete.
          preflight_payload="$(
            jq -cn '{prefixes:["data.yesid.dev/__sto-retirement-preflight__"]}'
          )"
          purge_cache "$preflight_payload" > cache-purge-preflight.json

          inventory_prefix "$SNAPSHOT_BUCKET" "$source_prefix" source-manifest.json
          source_count="$(jq length source-manifest.json)"

          # Establish one durable, full backup exactly once. Retries reuse it
          # when the public source is partial or already empty.
          if aws --endpoint-url "$S3_ENDPOINT" s3api head-object \
            --bucket "$BACKUP_BUCKET" --key "$durable_manifest_key" \
            > durable-manifest-head.json 2>/dev/null; then
            aws --endpoint-url "$S3_ENDPOINT" s3 cp \
              "s3://${BACKUP_BUCKET}/${durable_manifest_key}" \
              full-manifest.json --only-show-errors
          else
            test "$source_count" -gt 0
            aws --endpoint-url "$S3_ENDPOINT" s3 sync \
              "s3://${SNAPSHOT_BUCKET}/${source_prefix}" \
              "s3://${BACKUP_BUCKET}/${backup_data_prefix}" \
              --only-show-errors --no-progress
            inventory_prefix "$BACKUP_BUCKET" "$backup_data_prefix" full-manifest.json
            cmp source-manifest.json full-manifest.json
            aws --endpoint-url "$S3_ENDPOINT" s3 cp \
              full-manifest.json \
              "s3://${BACKUP_BUCKET}/${durable_manifest_key}" \
              --content-type application/json --only-show-errors
            aws --endpoint-url "$S3_ENDPOINT" s3 cp \
              "s3://${BACKUP_BUCKET}/${durable_manifest_key}" \
              durable-manifest-readback.json --only-show-errors
            cmp full-manifest.json durable-manifest-readback.json
          fi

          inventory_prefix "$BACKUP_BUCKET" "$backup_data_prefix" backup-manifest.json
          cmp full-manifest.json backup-manifest.json
          source_is_backed_up source-manifest.json full-manifest.json

          # All hosted publishers enumerate active providers and STO is inactive.
          # Re-prove no pre-cutover run is alive, then delete only backed-up keys.
          assert_publishers_idle
          inventory_prefix "$SNAPSHOT_BUCKET" "$source_prefix" pre-delete-manifest.json
          cmp source-manifest.json pre-delete-manifest.json
          source_is_backed_up pre-delete-manifest.json full-manifest.json

          delete_batch=0
          if [[ "$source_count" -gt 0 ]]; then
            jq -c --arg prefix "$source_prefix" \
              '[.[] | {Key:($prefix + .Key)}] as $objects
               | range(0; ($objects | length); 1000) as $offset
               | {Objects:$objects[$offset:$offset + 1000], Quiet:false}' \
              source-manifest.json > delete-requests.jsonl
            while IFS= read -r delete_request; do
              delete_batch="$((delete_batch + 1))"
              jq . <<< "$delete_request" > delete-request.json
              aws --endpoint-url "$S3_ENDPOINT" s3api delete-objects \
                --bucket "$SNAPSHOT_BUCKET" --delete file://delete-request.json \
                --output json > "delete-response-${delete_batch}.json"
              jq -e '((.Errors // []) | length) == 0' \
                "delete-response-${delete_batch}.json" >/dev/null
              expected="$(jq '.Objects | length' delete-request.json)"
              deleted="$(jq '(.Deleted // []) | length' "delete-response-${delete_batch}.json")"
              test "$deleted" = "$expected"
            done < delete-requests.jsonl
            test "$delete_batch" -gt 0
          fi

          inventory_prefix "$SNAPSHOT_BUCKET" "$source_prefix" remaining-manifest.json
          remaining="$(jq length remaining-manifest.json)"
          test "$remaining" = '0'
          inventory_prefix "$BACKUP_BUCKET" "$backup_data_prefix" backup-after-delete.json
          cmp full-manifest.json backup-after-delete.json

          purge_cache "$purge_payload" > cache-purge.json
          assert_quarantined

          full_count="$(jq length full-manifest.json)"
          full_bytes="$(jq '[.[].Size] | add // 0' full-manifest.json)"
          jq -n \
            --arg source_bucket "$SNAPSHOT_BUCKET" \
            --arg source_prefix "$source_prefix" \
            --arg backup_bucket "$BACKUP_BUCKET" \
            --arg backup_data_prefix "$backup_data_prefix" \
            --arg backup_evidence_prefix "$backup_evidence_prefix" \
            --arg manifest_sha256 "$(sha256sum full-manifest.json | cut -d' ' -f1)" \
            --arg github_sha "$GITHUB_SHA" \
            --arg github_run_id "$GITHUB_RUN_ID" \
            --argjson objects "$full_count" \
            --argjson bytes "$full_bytes" \
            --argjson objects_present_at_start "$source_count" \
            --argjson delete_batches "$delete_batch" \
            '{schema_version:1, source_bucket:$source_bucket, source_prefix:$source_prefix,
              backup_bucket:$backup_bucket, backup_data_prefix:$backup_data_prefix,
              backup_evidence_prefix:$backup_evidence_prefix, objects:$objects, bytes:$bytes,
              objects_present_at_start:$objects_present_at_start,
              delete_batches:$delete_batches, manifest_sha256:$manifest_sha256,
              github_sha:$github_sha, github_run_id:$github_run_id,
              cache_prefixes_purged:["data.yesid.dev/v1/","transit.yesid.dev/data/v1/"],
              source_remaining:0, quarantine_status:410}' \
            | tee retirement-receipt.json
          aws --endpoint-url "$S3_ENDPOINT" s3 cp \
            retirement-receipt.json \
            "s3://${BACKUP_BUCKET}/${durable_receipt_key}" \
            --content-type application/json --only-show-errors
          aws --endpoint-url "$S3_ENDPOINT" s3 cp \
            "s3://${BACKUP_BUCKET}/${durable_receipt_key}" \
            durable-receipt-readback.json --only-show-errors
          cmp retirement-receipt.json durable-receipt-readback.json

      - name: Upload retirement evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sto-retirement-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            *manifest*.json
            backup-after-delete.json
            cache-purge*.json
            delete-response-*.json
            durable-receipt-readback.json
            retirement-receipt.json
          if-no-files-found: warn
