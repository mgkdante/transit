<!doctype html>
<html lang="%lang%" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<script>
			(function () {
				var d = document.documentElement,
					t = null;
				try {
					t = localStorage.getItem('theme');
				} catch (e) {}
				if (t !== 'light' && t !== 'dark') {
					t = 'dark';
				}
				d.dataset.theme = t;
			})();
		</script>
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141414" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F6FB" />
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="%sveltekit.assets%/fonts/inter-latin-wght-normal.woff2"
			crossorigin
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="%sveltekit.assets%/fonts/jetbrains-mono-latin-wght-normal.woff2"
			crossorigin
		/>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/apple-touch-icon-180.png"
		/>
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Transit" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
