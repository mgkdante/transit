# transit-data-proxy — serves the public /v1 snapshot contract from the
# transit-snapshots R2 bucket on the canonical host (slice-9.1.1p), plus the
# aggregated public KPI endpoint /api/v1/kpis (src/kpis.js).
#
# Deliberately narrow zone ROUTES: the compatibility data/API surfaces plus one
# direct-domain STO retirement path. The transit routes beat the web app's wider
# transit.yesid.dev/* route; every other path falls through. /api/v1/* stays one
# level below /api/* so the web app keeps /api/vitals. The data.yesid.dev route
# returns 410 only for the inactive STO prefix. Do not widen or delete these
# routes without re-running smoke.sh.
name = "transit-data-proxy"
main = "src/worker.js"
compatibility_date = "2026-06-10"
# R2 endpoint account hash already public in .env.example (BRONZE_S3_ENDPOINT).
account_id = "eccfb9bedd87d413eaf4cac6ae2285d3"
workers_dev = false

routes = [
  { pattern = "transit.yesid.dev/data/*", zone_name = "yesid.dev" },
  { pattern = "transit.yesid.dev/api/v1/*", zone_name = "yesid.dev" },
  { pattern = "data.yesid.dev/v1/sto/*", zone_name = "yesid.dev" },
]

[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "transit-snapshots"
