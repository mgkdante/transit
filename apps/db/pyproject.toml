[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transit-ops"
version = "0.1.0"
description = "STM-first, provider-ready GTFS and GTFS-RT analytics foundation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.18.5,<2.0",
  "boto3>=1.43.59,<2.0",
  "gtfs-realtime-bindings>=2.2.0,<3.0",
  "pydantic>=2.13.4,<3.0",
  "pydantic-settings>=2.14.2,<3.0",
  "psycopg[binary]>=3.3.4,<4.0",
  "pyyaml>=6.0,<7.0",
  "python-dotenv>=1.0,<2.0",
  "sqlalchemy>=2.0.51,<3.0",
  "typer>=0.27.0,<1.0",
  "pyshp>=3.1.6,<4.0",
  "httpx>=0.28.1",
  "fastapi>=0.141.1",
]

[project.scripts]
transit-ops = "transit_ops.cli:app"

[dependency-groups]
dev = [
  "boto3-stubs[s3]==1.43.59",
  "botocore-stubs==1.43.14",
  "mypy-boto3-s3==1.43.50",
  "mypy>=2.3.0,<3.0",
  "pytest>=9.1.1,<10.0",
  "ruff>=0.16.0,<0.17",
]
health = [
    "uvicorn[standard]>=0.52.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/transit_ops/db/migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = [
    "src/transit_ops/s3.py",
    "src/transit_ops/source_factory/runner.py",
    "src/transit_ops/source_factory/operations.py",
    "tests/typing/source_factory.py",
    "src/transit_ops/snapshots/publish.py",
    "src/transit_ops/snapshots/publication_lane.py",
    "src/transit_ops/snapshots/historic_streams.py",
    "src/transit_ops/snapshots/historic_graph.py",
    "src/transit_ops/snapshots/historic_tier.py",
    "src/transit_ops/snapshots/historic_compatibility.py",
    "src/transit_ops/snapshots/envelope.py",
    "src/transit_ops/snapshots/uploads.py",
    "src/transit_ops/snapshots/protocols.py",
    "src/transit_ops/snapshots/storage.py",
    "src/transit_ops/gold/reader",
    "src/transit_ops/gold/delay_sums.py",
    "src/transit_ops/gold/delay_periods.py",
    "src/transit_ops/gold/delay_hours.py",
    "src/transit_ops/gold/delay_cohorts.py",
    "src/transit_ops/gold/delay_days.py",
    "src/transit_ops/gold/transactions.py",
    "src/transit_ops/gold/realtime.py",
    "src/transit_ops/maintenance/_helpers.py",
    "src/transit_ops/maintenance/silver.py",
    "src/transit_ops/maintenance/bronze.py",
    "src/transit_ops/maintenance/i3.py",
]
follow_imports = "silent"
strict = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
show_error_codes = true
