services:
  postgres:
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    environment:
      POSTGRES_DB: transit_ci
      POSTGRES_USER: transit_ci
      POSTGRES_PASSWORD: ${TRANSIT_REAL_DB_PASSWORD:?TRANSIT_REAL_DB_PASSWORD is required}
    ports:
      - "127.0.0.1::5432"
    volumes:
      - real_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit_ci -d transit_ci"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  real_db_data:
    name: ${TRANSIT_REAL_DB_VOLUME:?TRANSIT_REAL_DB_VOLUME is required}
